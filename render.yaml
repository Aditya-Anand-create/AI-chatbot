# Render blueprint: one free web service serves the API and the built React app.
services:
  - type: web
    name: ai-chatbot
    runtime: node
    plan: free
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: cd server && npm run start:demo   # in-memory MongoDB (history resets on restart). For persistence use `npm start` + MONGODB_URI
    envVars:
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
